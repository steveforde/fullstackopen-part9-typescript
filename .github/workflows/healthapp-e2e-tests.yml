name: Health app E2E Tests

on:
  push:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install healthapp dependencies
        working-directory: ./healthapp
        run: npm ci

      - name: Lint healthapp
        working-directory: ./healthapp
        run: npm run lint

      - name: Install test dependencies
        working-directory: ./healthapp-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./healthapp-tests
        # Removed --with-deps to stop the pipeline from hanging
        run: npx playwright install chromium

      - name: Start healthapp server
        working-directory: ./healthapp
        run: |
          npm run dev > server.log 2>&1 &
          echo $! > server.pid
          npx wait-on http://localhost:3000 --timeout 30000 || (cat server.log && exit 1)

      - name: Run e2e tests
        working-directory: ./healthapp-tests
        run: npm test

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: healthapp-tests/playwright-report/
          retention-days: 30

      - name: Stop healthapp server
        if: always()
        run: pkill -f "npm start" || true
